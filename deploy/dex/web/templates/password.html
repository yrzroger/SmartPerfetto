{{ template "header.html" . }}

<div class="theme-panel">
  <h2 class="theme-heading">登录 SmartPerfetto</h2>
  <form method="post" action="{{ .PostURL }}">
    <div class="theme-form-row">
      <div class="theme-form-label">
        <label for="login">邮箱地址</label>
      </div>
	  <input tabindex="1" required id="login" name="login" type="email" class="theme-form-input" placeholder="name@lan.local" autocomplete="username" {{ if .Username }} value="{{ .Username }}" {{ else }} autofocus {{ end }}/>
    </div>

    {{ if .Invalid }}
      <div id="login-error" class="dex-error-box">
        该邮箱未开通账号，请联系管理员添加。
      </div>
    {{ end }}

    <button tabindex="2" id="submit-login" type="submit" class="dex-btn theme-btn--primary">登录</button>

  </form>
  {{ if .BackLink }}
  <div class="theme-link-back">
    <a class="dex-subtle-text" href="{{ .BackLink }}">选择其他登录方式</a>
  </div>
  {{ end }}
</div>

<p class="sp-hint">使用管理员登记的邮箱登录，无需密码。</p>


<script type="text/javascript">
  document.querySelector('form').onsubmit = function(e) {
    var el = document.querySelector('#submit-login');
    el.setAttribute('disabled', 'disabled');
  };
</script>

{{ template "footer.html" . }}
